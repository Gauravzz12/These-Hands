<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>These Hands — Sprite Inspector & Issue Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(20, 26, 43, 0.94);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.18);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.35);
      --red: #ef4444;
      --green: #22c55e;
      --purple: #a855f7;
      --blue: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      padding: 24px 28px 80px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 12% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 88% 85%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.03) 0%, transparent 60%);
    }

    header {
      max-width: 1600px;
      margin: 0 auto 24px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .logo-group h1 {
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 2rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 1px;
    }

    .logo-group h1 span { color: var(--gold); }
    .logo-group .tagline {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      text-decoration: none;
      user-select: none;
    }

    .btn:hover {
      background: #334155;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn.btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b0f19;
      border-color: #f59e0b;
    }
    .btn.btn-gold:hover {
      box-shadow: 0 0 16px var(--gold-glow);
    }

    .btn.btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn.btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    /* Controls Panel */
    .controls-panel {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .filters-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
    }

    .filter-pill:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.22);
    }

    .filter-pill.active {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0b0f19;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    .filter-pill.flagged-pill.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.4);
    }

    .search-input {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 8px 18px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
      min-width: 250px;
      transition: border-color 0.16s ease;
    }

    .search-input:focus {
      border-color: var(--gold);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tool-label {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    .segmented {
      display: inline-flex;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 3px;
    }

    .segmented button {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .segmented button.active {
      background: var(--gold);
      color: #0b0f19;
      box-shadow: 0 0 10px var(--gold-glow);
    }

    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .toggle-chip input[type="checkbox"] {
      accent-color: var(--gold);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Grid Layout */
    .grid {
      max-width: 1600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 22px;
    }

    /* Enemy Card */
    .enemy-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .enemy-card:hover {
      border-color: var(--card-border-hover);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .enemy-card.is-flagged {
      border-color: rgba(239, 68, 68, 0.65);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.22);
    }

    .enemy-card.boss-card {
      border-color: rgba(245, 158, 11, 0.3);
    }

    .enemy-card.world-card {
      border-color: rgba(168, 85, 247, 0.3);
    }

    /* Card Top */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .enemy-id-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .idx-pill {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--gold);
      font-family: 'Bungee', cursive, monospace;
      font-size: 0.95rem;
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .enemy-title h3 {
      font-size: 1.15rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

    .enemy-meta-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
    }

    .role-badge {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .role-Regular { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; }
    .role-Elite { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .role-Boss { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .role-Final-Boss { background: rgba(239, 68, 68, 0.25); color: #f87171; }
    .role-WORLD-BOSS { background: rgba(168, 85, 247, 0.25); color: #c084fc; }
    .role-MINI-BOSS { background: rgba(234, 179, 8, 0.25); color: #fde047; }
    .role-World-Foe { background: rgba(147, 51, 234, 0.2); color: #d8b4fe; }

    .flag-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .flag-btn:hover {
      background: #334155;
      color: #fff;
    }

    .flag-btn.flagged {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.6);
      color: #f87171;
    }

    /* Card Main View Row */
    .view-row {
      display: flex;
      gap: 16px;
      align-items: stretch;
    }

    .canvas-container {
      position: relative;
      background: radial-gradient(circle at 50% 50%, #172033 0%, #0c1220 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      overflow: hidden;
      width: 200px;
      height: 270px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }

    .canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .canvas-overlay-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    .reticle-hint {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* Card Right Info */
    .card-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .pose-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .pose-tab {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text-sub);
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-transform: capitalize;
    }

    .pose-tab:hover {
      background: #1f2937;
      color: #fff;
    }

    .pose-tab.active {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0b0f19;
      font-weight: 900;
    }

    .info-metrics {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(11, 15, 25, 0.6);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.78rem;
    }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .metric-lbl {
      color: var(--text-dim);
      font-weight: 700;
    }

    .metric-val {
      color: var(--text);
      font-weight: 800;
      font-family: monospace;
    }

    .color-swatches {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* Cheek Editor */
    .cheek-editor {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(11, 15, 25, 0.6);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cheek-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
    }

    .coord-inputs {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .coord-inputs input {
      width: 60px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 3px 6px;
      color: #fff;
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: 800;
      text-align: center;
      outline: none;
    }

    .coord-inputs input:focus {
      border-color: var(--gold);
    }

    .btn-copy-coords {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .btn-copy-coords:hover {
      background: #1e293b;
      color: #fff;
    }

    /* Audit Issues Section */
    .audit-section {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audit-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .issues-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .issue-label {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      user-select: none;
      transition: all 0.14s ease;
    }

    .issue-label:has(input:checked) {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .issue-label input[type="checkbox"] {
      accent-color: var(--red);
      cursor: pointer;
    }

    .notes-input {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      resize: vertical;
      min-height: 54px;
      transition: border-color 0.16s ease;
    }

    .notes-input:focus {
      border-color: var(--gold);
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      width: 100%;
      max-width: 740px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h3 { font-family: 'Bungee', cursive, sans-serif; font-size: 1.2rem; color: #fff; }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-body textarea {
      width: 100%;
      height: 380px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px;
      color: #cbd5e1;
      font-family: monospace;
      font-size: 0.85rem;
      resize: none;
      outline: none;
    }

    .modal-foot {
      padding: 14px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="logo-group">
        <h1><span>THESE HANDS</span> SPRITE INSPECTOR</h1>
        <div class="tagline">Comprehensive visual audit tool for all 62 character & enemy sprites across Stages 1–10, Asura Realm & Shadow Verse.</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-gold" id="btnCopyReport">📋 Copy Fix Report</button>
        <button class="btn" id="btnExportJson">💾 Export JSON</button>
        <button class="btn" id="btnImportJson">📥 Import JSON</button>
        <button class="btn btn-danger" id="btnClearAudit">Reset Flags</button>
      </div>
    </div>

    <!-- Filter & Tool Bar -->
    <div class="controls-panel">
      <div class="ctrl-row">
        <div class="filters-wrap" id="filtersWrap">
          <button class="filter-pill active" data-filter="all">All Foes (62)</button>
          <button class="filter-pill" data-filter="g1-2">Pre-Monkey (0–9)</button>
          <button class="filter-pill" data-filter="g3-4">Gym & Castle (10–19)</button>
          <button class="filter-pill" data-filter="g5-6">Graveyard & Dojo (20–29)</button>
          <button class="filter-pill" data-filter="g7-8">Dark Woods & Tomb (30–39)</button>
          <button class="filter-pill" data-filter="g9-10">Mountain & Dragon (40–49)</button>
          <button class="filter-pill" data-filter="w1">Asura Realm (200–205)</button>
          <button class="filter-pill" data-filter="w2">Shadow Verse (210–215)</button>
          <button class="filter-pill" data-filter="bosses">Bosses & Elites</button>
          <button class="filter-pill flagged-pill" data-filter="flagged" id="flaggedFilterBtn">⚠️ Flagged for Fix (0)</button>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search name, group or #idx..." />
      </div>

      <div class="ctrl-row">
        <div class="tool-group">
          <span class="tool-label">Global Pose:</span>
          <div class="segmented" id="globalPoseSegment">
            <button class="active" data-pose="idle">Idle</button>
            <button data-pose="attack">Attack</button>
            <button data-pose="dizzy">Dizzy</button>
            <button data-pose="spPose">Special Pose</button>
          </div>
        </div>

        <div class="tool-group">
          <label class="toggle-chip">
            <input type="checkbox" id="chkAnimate" checked />
            <span>Live Animation</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="chkReticle" checked />
            <span>Cheek Hit Reticle</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="chkShadow" checked />
            <span>Ground Shadow</span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <!-- Grid of Enemies -->
  <main class="grid" id="enemyGrid"></main>

  <!-- Export/Import Modal -->
  <div class="modal-backdrop" id="reportModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Audit Report</h3>
        <button class="btn" id="btnCloseModal">✕ Close</button>
      </div>
      <div class="modal-body">
        <textarea id="modalText" readonly></textarea>
      </div>
      <div class="modal-foot">
        <button class="btn btn-gold" id="btnCopyModalText">Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <input type="file" id="jsonFileInput" accept=".json" style="display:none;" />

    // Storage Key
    const STORAGE_KEY = 'these_hands_sprite_audit_v2';
    let auditState = {
      flagged: {},
      issues: {},
      notes: {},
      coords: {}
    };

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) auditState = JSON.parse(saved);
    } catch(e) {}

    function saveAudit() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(auditState));
        updateFlaggedCount();
      } catch(e) {}
    }

    function updateFlaggedCount() {
      const count = Object.values(auditState.flagged).filter(Boolean).length;
      const btn = document.getElementById('flaggedFilterBtn');
      if (btn) btn.textContent = '⚠️ Flagged for Fix (' + count + ')';
    }

    // Resolves image paths seamlessly whether opened via file:/// or http://
    function getCandidateSources(src) {
      if (!src) return [];
      const clean = src.startsWith('/') ? src : '/' + src;
      if (window.location.protocol === 'file:') {
        return ['./public' + clean, '.' + clean, clean];
      }
      return [clean, './public' + clean, '/public' + clean];
    }

    const imgCache = {};
    function getImage(src) {
      if (!src) return null;
      if (imgCache[src]) return imgCache[src];

      const img = new Image();
      const candidates = getCandidateSources(src);
      let cIdx = 0;
      img.src = candidates[cIdx];
      img.onerror = () => {
        cIdx++;
        if (cIdx < candidates.length) {
          img.src = candidates[cIdx];
        }
      };
      imgCache[src] = img;
      return img;
    }

    // Audit Issue Types
    const AUDIT_ISSUES = [
      { id: 'cheek_misaligned', label: '🎯 Cheek Reticle Off' },
      { id: 'feet_cutoff', label: '🦶 Feet Cutoff / Floating' },
      { id: 'scale_off', label: '📏 Scale / Proportion Off' },
      { id: 'weak_attack', label: '💥 Weak / Missing Attack' },
      { id: 'flawed_dizzy', label: '💫 Missing / Flawed Dizzy' },
      { id: 'missing_sppose', label: '👑 Missing Special Pose' },
      { id: 'pixel_clash', label: '🎨 Art Style / Pixel Clash' },
      { id: 'contrast_issue', label: '🌓 Low Contrast / Muddy' },
      { id: 'wrong_facing', label: '👁️ Not Facing Player / Wrong Angle' }
    ];

    // State
    let currentFilter = 'all';
    let searchQuery = '';
    let globalPose = 'idle';
    let animateLive = true;
    let showReticle = true;
    let showShadow = true;
    const enemyState = {};

    function initEnemyState() {
      ENEMIES_DATA.forEach(e => {
        enemyState[e.idx] = {
          activePose: 'idle',
          customCheekX: auditState.coords[e.idx] ? auditState.coords[e.idx].x : e.cheekX,
          customCheekY: auditState.coords[e.idx] ? auditState.coords[e.idx].y : e.cheekY,
          // cached bounds for mouse click calibration
          renderedBounds: null
        };
      });
    }

    function renderGrid() {
      const grid = document.getElementById('enemyGrid');
      grid.innerHTML = '';

      const filtered = ENEMIES_DATA.filter(e => {
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const match = e.name.toLowerCase().includes(q) ||
                        e.groupName.toLowerCase().includes(q) ||
                        String(e.idx).includes(q);
          if (!match) return false;
        }

        if (currentFilter === 'all') return true;
        if (currentFilter === 'flagged') return !!auditState.flagged[e.idx];
        if (currentFilter === 'bosses') return e.role.includes('Boss') || e.role.includes('Elite');
        if (currentFilter === 'g1-2') return e.idx >= 0 && e.idx <= 9;
        if (currentFilter === 'g3-4') return e.idx >= 10 && e.idx <= 19;
        if (currentFilter === 'g5-6') return e.idx >= 20 && e.idx <= 29;
        if (currentFilter === 'g7-8') return e.idx >= 30 && e.idx <= 39;
        if (currentFilter === 'g9-10') return e.idx >= 40 && e.idx <= 49;
        if (currentFilter === 'w1') return e.idx >= 200 && e.idx <= 205;
        if (currentFilter === 'w2') return e.idx >= 210 && e.idx <= 215;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-sub); font-size: 1.1rem; font-weight: 700;">No enemy sprites match the selected filter or search term.</div>';
        return;

      filtered.forEach(e => {
        const card = document.createElement('div');
        const isBoss = e.role.includes('Boss') || e.role.includes('Elite');
        const isWorld = e.idx >= 200;
        const isFlagged = !!auditState.flagged[e.idx];

        card.className = 'enemy-card' + (isBoss ? ' boss-card' : '') + (isWorld ? ' world-card' : '') + (isFlagged ? ' is-flagged' : '');

        const roleCls = 'role-' + e.role.replace(/\s+/g, '-');
        const st = enemyState[e.idx];
        const poses = Object.keys(e.poses);

          const act = (st.activePose === p) ? ' active' : '';
          poseTabsHtml += '<button class="pose-tab' + act + '" data-idx="' + e.idx + '" data-pose="' + p + '">' + p + '</button>';
        });

        let swatchesHtml = '';
        if (e.colors && e.colors.length) {
          e.colors.forEach(col => {

          });
        }

        let issuesHtml = '';
        const savedIssues = auditState.issues[e.idx] || {};
        AUDIT_ISSUES.forEach(iss => {
          const chk = savedIssues[iss.id] ? 'checked' : '';
          issuesHtml += `

              <input type="checkbox" data-idx="${e.idx}" data-issue="${iss.id}" ${chk}>
              <span>${iss.label}</span>
            </label>
          `;

        const savedNote = auditState.notes[e.idx] || '';

        card.innerHTML = `

            </div>
            <button class="flag-btn ${isFlagged ? 'flagged' : ''}" data-idx="${e.idx}" id="flag-btn-${e.idx}">
              ${isFlagged ? '⚠️ FLAGGED' : '⚑ FLAG FOR FIX'}
            </button>
          </div>

          <div class="view-row">
            <div class="canvas-container" id="container-${e.idx}" title="Click directly on sprite to position cheek reticle">
              <canvas id="canvas-${e.idx}" width="200" height="270"></canvas>
              <div class="canvas-overlay-tag" id="tag-${e.idx}">${st.activePose}</div>
              <div class="reticle-hint">Click sprite to set cheek</div>
            </div>

            <div class="card-right">
              <div class="pose-tabs" id="tabs-${e.idx}">${poseTabsHtml}</div>

              <div class="info-metrics">
                <div class="metric-row">
                  <span class="metric-lbl">Pose Size</span>
                  <span class="metric-val" id="dim-${e.idx}">--</span>
                </div>
                <div class="metric-row">
                  <span class="metric-lbl">refH / Scale</span>
                  <span class="metric-val">${e.refH}px</span>
                </div>
                <div class="metric-row">
                  <span class="metric-lbl">HP / DMG</span>
                  <span class="metric-val">${Number(e.hp).toLocaleString()} · ${e.dmg}</span>
                </div>
                <div class="metric-row">
                  <span class="metric-lbl">Palette</span>
                  <div class="color-swatches">${swatchesHtml}</div>
                </div>
              </div>

              <div class="cheek-editor">
                <div class="cheek-header">
                  <span class="metric-lbl">🎯 Cheek Reticle:</span>
                  <button class="btn-copy-coords" data-idx="${e.idx}">Copy</button>
                </div>
                <div class="coord-inputs">
                  <span style="font-size:0.75rem; color:var(--text-dim);">X:</span>
                  <input type="number" step="0.01" min="0" max="1" id="input-cx-${e.idx}" value="${st.customCheekX}" />
                  <span style="font-size:0.75rem; color:var(--text-dim); margin-left:4px;">Y:</span>
                  <input type="number" step="0.01" min="0" max="1" id="input-cy-${e.idx}" value="${st.customCheekY}" />
                </div>
              </div>
            </div>
          </div>

          <div class="audit-section">
            <div class="audit-title">
              <span>Fix / Issue Checklist:</span>
            </div>
            <div class="issues-chips">
              ${issuesHtml}
            </div>
            <textarea class="notes-input" data-idx="${e.idx}" placeholder="Specific feedback or fix note for this sprite...">${savedNote}</textarea>
          </div>
        `;

        grid.appendChild(card);
      });

      wireCardEvents();
    }

    function wireCardEvents() {
      // Flag button
      document.querySelectorAll('.flag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.idx;
          const isFlagged = !auditState.flagged[idx];
          auditState.flagged[idx] = isFlagged;
          btn.classList.toggle('flagged', isFlagged);
          btn.textContent = isFlagged ? '⚠️ FLAGGED' : '⚑ FLAG FOR FIX';
          const card = document.getElementById('enemy-card-' + idx);
          if (card) card.classList.toggle('is-flagged', isFlagged);
          saveAudit();
        });
      });

      // Pose tabs
      document.querySelectorAll('.pose-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const idx = tab.dataset.idx;
          const pose = tab.dataset.pose;
          enemyState[idx].activePose = pose;

          const tabsWrap = document.getElementById('tabs-' + idx);
          if (tabsWrap) {
            tabsWrap.querySelectorAll('.pose-tab').forEach(t => t.classList.toggle('active', t.dataset.pose === pose));
          }
          const tag = document.getElementById('tag-' + idx);
          if (tag) tag.textContent = pose;
        });
      });

      // Click on canvas to position cheek reticle
      document.querySelectorAll('.canvas-container').forEach(container => {
        container.addEventListener('click', (ev) => {
          const canvas = container.querySelector('canvas');
          if (!canvas) return;
          const idx = canvas.id.replace('canvas-', '');
          const st = enemyState[idx];
          if (!st || !st.renderedBounds) return;

          const rect = canvas.getBoundingClientRect();
          const clickX = ev.clientX - rect.left;
          const clickY = ev.clientY - rect.top;

          const b = st.renderedBounds;
          const normX = Math.max(0, Math.min(1, (clickX - b.left) / b.width));
          const normY = Math.max(0, Math.min(1, (clickY - b.top) / b.height));

          st.customCheekX = Math.round(normX * 100) / 100;
          st.customCheekY = Math.round(normY * 100) / 100;

          const inX = document.getElementById('input-cx-' + idx);
          const inY = document.getElementById('input-cy-' + idx);
          if (inX) inX.value = st.customCheekX;
          if (inY) inY.value = st.customCheekY;

          auditState.coords[idx] = { x: st.customCheekX, y: st.customCheekY };
          saveAudit();
        });
      });

      // Cheek coordinate inputs
      document.querySelectorAll('.coord-inputs input').forEach(input => {
        input.addEventListener('input', () => {
          const id = input.id;
          const isX = id.includes('-cx-');
          const idx = id.replace(isX ? 'input-cx-' : 'input-cy-', '');
          const val = parseFloat(input.value) || 0;
          if (isX) enemyState[idx].customCheekX = val;
          else enemyState[idx].customCheekY = val;

          auditState.coords[idx] = {
            x: enemyState[idx].customCheekX,
            y: enemyState[idx].customCheekY
          };
          saveAudit();
        });
      });

      // Copy coordinates button
      document.querySelectorAll('.btn-copy-coords').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.idx;
          const st = enemyState[idx];
          const text = `cheekX: ${st.customCheekX}, cheekY: ${st.customCheekY}`;
          navigator.clipboard.writeText(text).then(() => {
            const original = btn.textContent;
            btn.textContent = '✓ Copied';
            setTimeout(() => { btn.textContent = original; }, 1400);
          });
        });
      });

      // Issues checkboxes
      document.querySelectorAll('.issue-label input[type="checkbox"]').forEach(chk => {
        chk.addEventListener('change', () => {
          const idx = chk.dataset.idx;
          const issue = chk.dataset.issue;
          if (!auditState.issues[idx]) auditState.issues[idx] = {};
          auditState.issues[idx][issue] = chk.checked;

          // Auto-flag if any issue is checked
          const hasAny = Object.values(auditState.issues[idx]).some(Boolean);
          if (hasAny && !auditState.flagged[idx]) {
            auditState.flagged[idx] = true;
            const flagBtn = document.getElementById('flag-btn-' + idx);
            if (flagBtn) {
              flagBtn.classList.add('flagged');
              flagBtn.textContent = '⚠️ FLAGGED';
            }
            const card = document.getElementById('enemy-card-' + idx);
            if (card) card.classList.add('is-flagged');
          }
          saveAudit();
        });
      });

      // Notes inputs
      document.querySelectorAll('.notes-input').forEach(textarea => {
        textarea.addEventListener('input', () => {
          const idx = textarea.dataset.idx;
          auditState.notes[idx] = textarea.value.trim();
          if (auditState.notes[idx] && !auditState.flagged[idx]) {
            auditState.flagged[idx] = true;
            const flagBtn = document.getElementById('flag-btn-' + idx);
            if (flagBtn) {
              flagBtn.classList.add('flagged');
              flagBtn.textContent = '⚠️ FLAGGED';
            }
            const card = document.getElementById('enemy-card-' + idx);
            if (card) card.classList.add('is-flagged');
          }
          saveAudit();
        });
      });
    }

    // Canvas animation loop
    function drawCanvases(ts) {
      const t = ts / 1000;

      ENEMIES_DATA.forEach(e => {
        const canvas = document.getElementById('canvas-' + e.idx);
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        const st = enemyState[e.idx] || { activePose: 'idle', customCheekX: e.cheekX, customCheekY: e.cheekY };
        const poseObj = e.poses[st.activePose] || e.poses['idle'] || Object.values(e.poses)[0];
        if (!poseObj) return;

        const img = getImage(poseObj.src);

        // Update dimension text
        const dimEl = document.getElementById('dim-' + e.idx);
        if (dimEl) dimEl.textContent = poseObj.w + ' × ' + poseObj.h;

        // Ground baseline
        const feetY = H * 0.85;
        const cx = W / 2;

        // Ground shadow & baseline
        if (showShadow) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
          ctx.fillRect(0, feetY, W, 1);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
          ctx.beginPath();
          ctx.ellipse(cx, feetY + 4, 56, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Target render dimensions anchored to feetY
        const targetH = H * 0.72;
        const scale = targetH / (e.refH || 900);
        const dw = poseObj.w * scale;
        const dh = poseObj.h * scale;

        // Save rendered bounds for click detection
        st.renderedBounds = {
          left: cx - dw / 2,
          top: feetY - dh,
          width: dw,
          height: dh
        };

        ctx.save();
        ctx.translate(cx, feetY);

        if (animateLive) {
          if (st.activePose === 'idle') {
            const breathe = Math.sin(t * 2.8 + e.idx) * 0.016;
            ctx.scale(1 - breathe * 0.35, 1 + breathe);
          } else if (st.activePose.includes('attack') || st.activePose === 'attack1') {
            const lunge = Math.sin(t * 6 + e.idx) * 6;
            ctx.translate(0, -Math.abs(lunge));
          } else if (st.activePose === 'dizzy') {
            ctx.rotate(Math.sin(t * 3.5 + e.idx) * 0.05);
          }
        }

        // Draw image
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, -dw / 2, -dh, dw, dh);
        } else {
          // Placeholder loading box
          ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
          ctx.fillRect(-dw / 2, -dh, dw, dh);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.strokeRect(-dw / 2, -dh, dw, dh);
        }

        // Cheek Target Reticle
        if (showReticle) {
          const reticleLocalX = -dw / 2 + dw * st.customCheekX;
          const reticleLocalY = -dh + dh * st.customCheekY;

          ctx.save();
          ctx.translate(reticleLocalX, reticleLocalY);

          // Reticle outer glow
          ctx.beginPath();
          ctx.arc(0, 0, 11, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(239, 68, 68, 0.28)';
          ctx.fill();
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Crosshairs
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-14, 0); ctx.lineTo(-4, 0);
          ctx.moveTo(4, 0); ctx.lineTo(14, 0);
          ctx.moveTo(0, -14); ctx.lineTo(0, -4);
          ctx.moveTo(0, 4); ctx.lineTo(0, 14);
          ctx.stroke();

          // Center target dot
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        ctx.restore();
      });

      requestAnimationFrame(drawCanvases);
    }

    // Filter toolbar events
    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        renderGrid();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderGrid();
    });

    document.querySelectorAll('#globalPoseSegment button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#globalPoseSegment button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        globalPose = btn.dataset.pose;

        ENEMIES_DATA.forEach(e => {
          if (e.poses[globalPose]) {
            enemyState[e.idx].activePose = globalPose;
            const tabsWrap = document.getElementById('tabs-' + e.idx);
            if (tabsWrap) {
              tabsWrap.querySelectorAll('.pose-tab').forEach(t => t.classList.toggle('active', t.dataset.pose === globalPose));
            }
            const tag = document.getElementById('tag-' + e.idx);
            if (tag) tag.textContent = globalPose;
          }
        });
      });
    });

    document.getElementById('chkAnimate').addEventListener('change', (e) => { animateLive = e.target.checked; });
    document.getElementById('chkReticle').addEventListener('change', (e) => { showReticle = e.target.checked; });
    document.getElementById('chkShadow').addEventListener('change', (e) => { showShadow = e.target.checked; });

    // Export / Report Tools
    const modal = document.getElementById('reportModal');
    const modalText = document.getElementById('modalText');
    const modalTitle = document.getElementById('modalTitle');

    document.getElementById('btnCloseModal').addEventListener('click', () => { modal.classList.remove('open'); });

    document.getElementById('btnCopyReport').addEventListener('click', () => {
      const flaggedIndices = Object.keys(auditState.flagged).filter(k => auditState.flagged[k]);
      if (flaggedIndices.length === 0) {
        alert('No enemies currently flagged! Click "⚑ FLAG FOR FIX" or check issues on any enemy card to add items to your report.');
        return;
      }

      let md = '# These Hands — Sprite Audit & Fix List\n\n';
      md += `Generated on: ${new Date().toLocaleString()} · Total Flagged: ${flaggedIndices.length}\n\n`;

      flaggedIndices.forEach(idx => {
        const e = ENEMIES_DATA.find(x => x.idx === Number(idx));
        if (!e) return;
        const issuesObj = auditState.issues[idx] || {};
        const checkedIssues = Object.keys(issuesObj).filter(k => issuesObj[k]).map(id => {
          const match = AUDIT_ISSUES.find(iss => iss.id === id);
          return match ? match.label : id;
        });
        const note = auditState.notes[idx] || 'None specified';
        const coords = auditState.coords[idx] || { x: e.cheekX, y: e.cheekY };

        md += `### #${e.idx} ${e.name} (${e.role} · ${e.groupName})\n`;
        md += `- **Cheek Coordinates**: (X: ${coords.x}, Y: ${coords.y}) [Baseline: ${e.cheekX}, ${e.cheekY}]\n`;
        md += `- **Identified Issues**: ${checkedIssues.length ? checkedIssues.join(', ') : 'General fix needed'}\n`;
        md += `- **Notes**: ${note}\n\n`;
      });

      modalTitle.textContent = '📋 Markdown Fix Report (' + flaggedIndices.length + ' Flagged)';
      modalText.value = md;
      modal.classList.add('open');
    });

    document.getElementById('btnExportJson').addEventListener('click', () => {
      const jsonStr = JSON.stringify(auditState, null, 2);
      modalTitle.textContent = '💾 Export Audit Data (JSON)';
      modalText.value = jsonStr;
      modal.classList.add('open');
    });

    document.getElementById('btnCopyModalText').addEventListener('click', () => {
      modalText.select();
      navigator.clipboard.writeText(modalText.value).then(() => {
        alert('Copied to clipboard!');
      });
    });

    document.getElementById('btnImportJson').addEventListener('click', () => {
      document.getElementById('jsonFileInput').click();
    });

    document.getElementById('jsonFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          auditState = data;
          saveAudit();
          initEnemyState();
          renderGrid();
          alert('Audit data imported successfully!');
        } catch(err) {
          alert('Invalid JSON file format.');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('btnClearAudit').addEventListener('click', () => {
      if (confirm('Are you sure you want to clear all flagged sprites and notes?')) {
        auditState = { flagged: {}, issues: {}, notes: {}, coords: {} };
        saveAudit();
        initEnemyState();
        renderGrid();
      }
    });

    // Initialize
    initEnemyState();
    renderGrid();
    updateFlaggedCount();
    requestAnimationFrame(drawCanvases);
  </script>
</body>
</html>
